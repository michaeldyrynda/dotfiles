#--------------------------------------------------------------------------
# General
#--------------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind-key -r C-a send-prefix

set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g allow-rename off
set -g automatic-rename off
set -g display-panes-time 350
set -g detach-on-destroy off
set -g aggressive-resize on
set -g focus-events on
set -g history-limit 10000
set -s escape-time 0

#--------------------------------------------------------------------------
# Terminal & colors
#--------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',xterm-ghostty:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g set-clipboard on
set -g pane-border-lines heavy

#--------------------------------------------------------------------------
# Key bindings
#--------------------------------------------------------------------------

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Copy mode (vim-style, clipboard via OSC 52)
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Windows
unbind c
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}" \; \
    split-window -h -p 75 -c "#{pane_current_path}" \; \
    split-window -h -p 33 -c "#{pane_current_path}" \; \
    select-pane -t 1

# Panes
bind - split-window -v  -c '#{pane_current_path}'
bind \\ split-window -h  -c '#{pane_current_path}'
unbind '"'
unbind %
bind b break-pane -d
bind-key j command-prompt -p "join pane from: "  "join-pane -h -s '%%'"
bind-key s display-panes\; command-prompt -p "pane #: "  "swap-pane -t '%%'"

# Pane resize
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Sessions
bind C-b send-keys 'tat && exit' 'C-m'
bind-key ! run-shell '(tmux switch-client -l || tmux switch-client -n) && tmux kill-session -t "#S" || tmux kill-session'
bind X confirm-before kill-session
bind C-j split-window -v "tmux list-sessions -F '#{session_activity}:#{session_name}' | sort -nr | cut -d ':' -f 2 | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# Layouts
bind M if-shell '[ $(tmux list-panes | wc -l) -eq 3 ]' \
    'run-shell "export w=$(tmux display-message -p #I) && tmux break-pane -d -s 3 -n __tmp3 && tmux break-pane -d -s 2 -n __tmp2 && tmux join-pane -h -s __tmp2.1 && tmux join-pane -h -s __tmp3.1 && tmux resize-pane -t 1 -x 25% && tmux resize-pane -t 2 -x 50% && tmux resize-pane -t 3 -x 25% && tmux select-pane -t 1"' \
    'display-message "Layout resize requires exactly 3 panes"'

# Alt+number to switch windows
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Quick-launch
bind-key h split-window -h "btop"
bind-key t split-window -h -c ~/ "nvim todo.md"
bind-key g split-window -h -c "#{pane_current_path}" "lazygit"
bind-key G split-window -h -c "#{pane_current_path}" "gh dash"

# Pass Page Up/Down through instead of entering copy-mode
bind -n PPage send-keys PPage
bind -n NPage send-keys NPage

#--------------------------------------------------------------------------
# Activity & titles
#--------------------------------------------------------------------------

set -g set-titles off
set -g monitor-activity off
set -g visual-bell off
set -g visual-activity on
set -g bell-action any

#--------------------------------------------------------------------------
# Plugins
#--------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

#--------------------------------------------------------------------------
# Theme (catppuccin)
#--------------------------------------------------------------------------

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "custom"

# Inactive window
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_number " #I  "
set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_left_separator "#[bg=#{@thm_surface_0}] "
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_surface_0},bg=#{@thm_surface_1}]"
set -g @catppuccin_window_right_separator ""

# Active window
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_current_number " #I  "
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_left_separator "#[bg=#{@thm_mauve}] "
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve},bg=#{@thm_surface_1}]"
set -g @catppuccin_window_current_right_separator ""

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

set -g status-keys vi
set -g status-position top
set -g status-interval 2
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M "
set -g @catppuccin_directory_text " #{b:pane_current_path} "

#--------------------------------------------------------------------------
# Initialise
#--------------------------------------------------------------------------

run -b '~/.tmux/plugins/tpm/tpm'

#--------------------------------------------------------------------------
# Environment
#--------------------------------------------------------------------------

set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
